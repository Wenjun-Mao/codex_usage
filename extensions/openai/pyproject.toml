[project]
name = "codex-usage-openai-probe"
version = "0.0.1"
description = "Synthetic-only private host feasibility probe, not the usage companion"
requires-python = ">=3.13"
dependencies = [
    "mcp==2.3.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.14.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
