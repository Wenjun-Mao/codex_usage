<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Usage</title><!-- STYLE --></head>
<body><main>
  <header><h1>Codex Usage</h1><span id="connection" role="status">Connecting</span></header>
  <nav aria-label="Dashboard view"><button id="usage-tab" class="command" aria-pressed="true">Usage</button><button id="storage-tab" class="command" aria-pressed="false">Task Storage</button></nav>
  <form id="filters" aria-label="Usage filters">
    <label>Period <select id="period"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="7d">Last 7 days</option><option value="30d" selected>Last 30 days</option><option value="month">This month</option><option value="all">All time</option><option value="custom">Custom</option></select></label>
    <span id="custom" hidden><label>From <input id="start" type="date" required></label><label>Through <input id="end" type="date" required></label></span>
    <label>Project <select id="project"><option value="all">All projects</option></select></label>
    <label>Theme <select id="theme"><option value="auto">Auto</option><option value="day">Day</option><option value="night">Night</option></select></label>
    <button type="button" id="reload" title="Reload captured data" aria-label="Reload captured data"><i data-lucide="refresh-cw"></i></button>
    <button type="button" id="expand" title="Fullscreen" aria-label="Fullscreen" hidden><i data-lucide="maximize-2"></i></button>
    <button type="button" id="ask" title="Ask about this selection" aria-label="Ask about this selection" hidden disabled><i data-lucide="message-square"></i></button>
    <button type="button" id="capture" class="command"><i data-lucide="scan-line"></i>Capture Usage</button>
  </form>
  <p id="error" role="alert" hidden></p><p id="freshness" class="muted"></p>
  <div id="usage-view">
    <section class="summary-grid" aria-label="Usage totals" id="totals"></section>
    <section id="allowance"><h2>Plan Allowance</h2><div id="buckets"></div><div id="estimate"></div><details><summary>Allowance history and evidence</summary><div id="allowance-details"></div></details></section>
    <section><h2>Language Categories</h2><div id="categories"></div></section>
    <section id="daily"><h2>Daily Cost Trend</h2><div id="daily-chart"></div><details><summary>Daily details</summary><div id="daily-table"></div></details><button id="daily-more" class="command" hidden>More days</button></section>
    <section><h2>Hourly Activity</h2><div id="hour-chart"></div><details><summary>Hourly details</summary><div id="hour-table"></div></details><button id="hour-more" class="command" hidden>More hours</button></section>
    <section><div class="section-heading"><h2>Usage Breakdown</h2><fieldset><legend>Compare by</legend><label><input type="radio" name="metric" value="api_cost" checked>API cost</label><label><input type="radio" name="metric" value="tokens">Tokens</label></fieldset></div>
      <label>Group <select id="dimension"><option value="project">Projects</option><option value="model">Models</option><option value="agent">Agents</option></select></label><div id="breakdown"></div><button id="breakdown-more" class="command" hidden>More rows</button>
    </section>
    <section><h2>Project Economics</h2><div id="economics"></div></section>
    <section><h2>Image Activity</h2><div id="images"></div></section>
    <section><h2>Compare Periods</h2><form id="comparison"><label>Baseline <select id="baseline"><option value="yesterday">Yesterday</option><option value="7d">Last 7 days</option><option value="30d">Last 30 days</option></select></label><button class="command">Compare</button></form><div id="comparison-result"></div></section>
  </div>
  <div id="storage-view" hidden><section><h2>Task Storage</h2><div id="storage-totals"></div><div id="trees"></div><button id="storage-more" class="command" hidden>More trees</button></section><section id="job" hidden><h2>Selected-tree analysis</h2><p id="job-state" role="status"></p><button id="cancel" class="command"><i data-lucide="square"></i>Cancel</button><div id="job-result"></div></section></div>
  <dialog id="confirm"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="dialog-actions"><button value="cancel" class="command">Cancel</button><button value="confirm" class="command">Confirm</button></div></form></dialog>
</main><!-- SCRIPT --></body></html>
