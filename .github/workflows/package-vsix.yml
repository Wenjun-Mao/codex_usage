name: Platform VSIX
run-name: "Codex Usage VSIX publish=${{ inputs.publish || false }} ref=${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the platform VSIX packages (dispatch must target a matching release tag)"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: codex-usage-distribution-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"

jobs:
  validate:
    name: Validate core and distribution contract
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      version: ${{ steps.mode.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve distribution mode
        id: mode
        env:
          REQUESTED_PUBLISH: ${{ inputs.publish || false }}
        run: |
          version="$(node -p "require('./extensions/vscode/package.json').version")"
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected_tag="v${version}"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Release tag $GITHUB_REF_NAME does not match version $version." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Release tags must point to a commit contained in origin/main." >&2
              exit 1
            fi
            publish=true
          elif [[ "$REQUESTED_PUBLISH" == "true" ]]; then
            echo "Marketplace publication requires dispatching a matching v$version tag." >&2
            exit 1
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Run Python tests
        run: uv run pytest -q

      - name: Run Ruff
        run: uv run ruff check .

  macos-vsix:
    name: Build macOS Apple Silicon VSIX
    needs: validate
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install companion dependencies
        working-directory: extensions/vscode
        run: npm ci

      - name: Test and package macOS VSIX
        working-directory: extensions/vscode
        run: |
          npm test
          npm run package:vsix:mac

      - name: Verify packaged macOS VSIX
        run: uv run python scripts/verify-vsix-archive.py output/releases/codex-usage-companion-darwin-arm64.vsix darwin-arm64

      - name: Install visual test browsers
        run: uv run playwright install chromium firefox webkit

      - name: Verify extension screenshots and allowance UI
        run: |
          uv run python scripts/generate_marketplace_screenshot.py --check
          uv run python scripts/check_allowance_ui.py

      - name: Upload macOS VSIX
        uses: actions/upload-artifact@v6
        with:
          name: codex-usage-companion-darwin-arm64
          path: output/releases/codex-usage-companion-darwin-arm64.vsix
          if-no-files-found: error
          retention-days: 14

  windows-vsix:
    name: Build Windows x64 VSIX
    needs: validate
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install companion dependencies
        working-directory: extensions/vscode
        run: npm ci

      - name: Test and package Windows VSIX
        working-directory: extensions/vscode
        run: |
          npm test
          npm run package:vsix:win

      - name: Verify packaged Windows VSIX
        run: uv run python scripts/verify-vsix-archive.py output/releases/codex-usage-companion-win32-x64.vsix win32-x64

      - name: Upload Windows VSIX
        uses: actions/upload-artifact@v6
        with:
          name: codex-usage-companion-win32-x64
          path: output/releases/codex-usage-companion-win32-x64.vsix
          if-no-files-found: error
          retention-days: 14

  publish-vsix:
    name: Publish platform VSIX packages
    needs:
      - validate
      - macos-vsix
      - windows-vsix
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install companion publishing dependencies
        working-directory: extensions/vscode
        run: npm ci

      - name: Download platform VSIX packages
        uses: actions/download-artifact@v6
        with:
          path: output/releases
          pattern: codex-usage-companion-*
          merge-multiple: true

      - name: Publish platform VSIX packages
        working-directory: extensions/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "$VSCE_PAT"
          npx vsce publish --skip-duplicate --packagePath ../../output/releases/codex-usage-companion-darwin-arm64.vsix
          npx vsce publish --skip-duplicate --packagePath ../../output/releases/codex-usage-companion-win32-x64.vsix
