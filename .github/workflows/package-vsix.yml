name: Platform VSIX
run-name: "Qualify Codex Usage VSIX ref=${{ github.ref_name }} probe=${{ inputs.fail_case != '' }}"
on:
  workflow_dispatch:
    inputs:
      fail_case:
        description: "Explicit synthetic case-key failure, first attempt only; never a release candidate"
        required: false
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: codex-usage-qualification-${{ github.ref }}
  cancel-in-progress: false
env:
  QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
  QUALIFICATION_PROBE: ${{ inputs.fail_case != '' }}
jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require nonpublishing main dispatch
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
      - uses: ./.github/actions/qualification-tools
      - name: Fail early on independent metadata, history and workflow contracts
        env:
          PYTHONPATH: scripts
        run: >-
          uv run pytest -q -p verification.pytest_inventory tests/test_release_history.py tests/test_github_actions_workflow.py
          --qualification-scope metadata --qualification-inventory output/qualification/metadata/inventory.json
          --junitxml=output/qualification/metadata/tests.xml
      - name: Prepare metadata proof
        run: >-
          uv run python scripts/qualification.py payload --gate metadata
          --directory output/qualification/metadata --output output/producer/payload.zip
      - uses: ./.github/actions/record-gate
        with:
          gate: metadata
          payload: output/producer/payload.zip
  core:
    name: Core and accounting
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/qualification-tools
      - name: Complete Python suite
        env:
          PYTHONPATH: scripts
        run: >-
          uv run pytest -q -p verification.pytest_inventory --qualification-scope core
          --qualification-inventory output/qualification/core/inventory.json --junitxml=output/qualification/core/tests.xml
      - name: Ruff
        run: uv run ruff check .
      - name: Frozen monetary parity and bounded work
        run: |
          uv run python scripts/check_speed_parity.py
          uv run python scripts/check_speed_work.py
      - name: Prepare core proof
        run: >-
          uv run python scripts/qualification.py payload --gate core
          --directory output/qualification/core --output output/producer/payload.zip
      - uses: ./.github/actions/record-gate
        with:
          gate: core
          payload: output/producer/payload.zip
  package:
    name: Package (${{ matrix.target }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-26
            script: package:vsix:mac
          - target: win32-x64
            os: windows-2025
            script: package:vsix:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/qualification-tools
      - name: Install locked companion dependencies
        working-directory: extensions/vscode
        run: npm ci
      - name: Complete extension tests and build matching collector/VSIX
        working-directory: extensions/vscode
        shell: bash
        env:
          PACKAGE_SCRIPT: ${{ matrix.script }}
          TARGET: ${{ matrix.target }}
        run: |
          npm run test:qualification -- "../../output/qualification/package-$TARGET/extension-tests.xml"
          npm run "$PACKAGE_SCRIPT"
      - name: Verify archive and disposable legacy handoff
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          uv run python scripts/verify-vsix-archive.py "output/releases/codex-usage-companion-$TARGET.vsix" "$TARGET"
          node scripts/accept_disposable_handoff.js
      - name: Prepare platform proof
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          uv run python scripts/qualification.py payload --gate "package-$TARGET"
          --directory "output/qualification/package-$TARGET" --output output/producer/payload.zip
          --package "output/releases/codex-usage-companion-$TARGET.vsix"
      - uses: ./.github/actions/record-gate
        with:
          gate: package-${{ matrix.target }}
          payload: output/producer/payload.zip
  visual:
    name: Visual (${{ matrix.suite }})
    needs: metadata
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite: [screenshots-allowance, speed, breakdown, overlay, hover]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/qualification-tools
      - name: Install screenshot renderer dependencies
        if: matrix.suite == 'screenshots-allowance'
        working-directory: extensions/vscode
        run: npm ci
      - name: Install all styling engines
        run: uv run playwright install chromium firefox webkit
      - name: Run independent synthetic suite
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          REQUESTED_FAILURE: ${{ inputs.fail_case }}
        run: |
          fault=""
          if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then fault="$REQUESTED_FAILURE"; fi
          uv run python scripts/run_visual_suite.py "$SUITE" --output "output/qualification/$SUITE" --fail-case "$fault"
      - name: Preserve bounded diagnostics even on assertion failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-${{ matrix.suite }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            output/qualification/${{ matrix.suite }}/**/*.json
            output/qualification/${{ matrix.suite }}/**/failure.png
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare complete visual proof
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: >-
          uv run python scripts/qualification.py payload --gate "visual-$SUITE"
          --directory "output/qualification/$SUITE" --output output/producer/payload.zip
      - uses: ./.github/actions/record-gate
        with:
          gate: visual-${{ matrix.suite }}
          payload: output/producer/payload.zip
  hosted:
    name: Freeze hosted qualification
    needs: [metadata, core, package, visual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/qualification-tools
      - name: Validate complete producer inventories and original executions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/qualification.py freeze --run "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT" --output output/qualification/hosted
      - name: Prepare immutable hosted manifest
        run: >-
          uv run python scripts/qualification.py payload --gate hosted
          --directory output/qualification/hosted --output output/producer/payload.zip
      - uses: ./.github/actions/record-gate
        with:
          gate: hosted
          payload: output/producer/payload.zip
  native:
    name: Native macOS
    needs: hosted
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/qualification-tools
      - name: Fetch exact qualified native package and hosted identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/qualification.py fetch-native --run "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT" --output output/native-input
      - name: Download hash-pinned isolated VS Code
        run: uv run python scripts/download_native_host.py --output "$RUNNER_TEMP/qualified-code"
      - name: Accept packaged collector/assets with isolated credentials
        run: >-
          uv run python scripts/check_usage_breakdown_webview.py
          --code "$RUNNER_TEMP/qualified-code/Visual Studio Code.app/Contents/MacOS/Code"
          --vsix output/native-input/qualified.vsix --qualification-input output/native-input/qualification-input.json
          --output output/qualification/native
      - name: Record pinned host metadata
        run: cp "$RUNNER_TEMP/qualified-code/host.json" output/qualification/native/host.json
      - name: Preserve native diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-native-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: output/qualification/native
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare native proof
        run: >-
          uv run python scripts/qualification.py payload --gate native
          --directory output/qualification/native --output output/producer/payload.zip
      - uses: ./.github/actions/record-gate
        with:
          gate: native
          payload: output/producer/payload.zip
