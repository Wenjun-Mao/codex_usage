name: Native Gate and Release
run-name: "Codex Usage native publish=${{ inputs.publish || false }} ref=${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish signed 2.0 artifacts (dispatch must target a matching release tag)"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"

jobs:
  validate:
    name: Validate core and release contract
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.mode.outputs.release }}
      version: ${{ steps.mode.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve workflow mode
        id: mode
        env:
          REQUESTED_PUBLISH: ${{ inputs.publish || false }}
        run: |
          version="$(node -p "require('./extensions/vscode/package.json').version")"
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release=true
            expected_tag="v${version}"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Release tag $GITHUB_REF_NAME does not match version $version." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Release tags must point to a commit contained in origin/main." >&2
              exit 1
            fi
          elif [[ "$REQUESTED_PUBLISH" == "true" ]]; then
            echo "Signed publication requires dispatching a matching v$version tag." >&2
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Run Python tests
        run: uv run pytest -q

      - name: Run Ruff
        run: uv run ruff check .

  companion:
    name: Build universal VS Code companion
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install companion dependencies
        working-directory: extensions/vscode
        run: npm ci

      - name: Test and package companion
        working-directory: extensions/vscode
        run: |
          npm test
          npm run package:vsix

      - name: Upload companion
        uses: actions/upload-artifact@v6
        with:
          name: codex-usage-companion
          path: output/releases/codex-usage-companion.vsix
          if-no-files-found: error
          retention-days: 14

  macos-native:
    name: Build macOS Apple Silicon native app
    needs: validate
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Build and smoke-test packaged agent
        run: ./scripts/build-agent-macos-arm64.sh

      - name: Install native app dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install screenshot browser
        run: uv run playwright install chromium

      - name: Test native frontend and Rust host
        working-directory: apps/desktop
        run: |
          npm test
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Verify native Marketplace screenshots
        run: uv run python scripts/generate_marketplace_screenshot.py --check

      - name: Build non-publishing native binary
        if: needs.validate.outputs.release != 'true'
        working-directory: apps/desktop
        run: npm run tauri build -- --target aarch64-apple-darwin --no-bundle --ci

      - name: Require Apple and updater signing secrets
        if: needs.validate.outputs.release == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing required secret: $name" >&2; exit 1; }
          done

      - name: Import Apple Developer ID certificate
        if: needs.validate.outputs.release == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/codex-usage-developer-id.p12"
          keychain="$RUNNER_TEMP/codex-usage-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          CERTIFICATE="$certificate" python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["CERTIFICATE"]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE"]))'
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build signed and notarized macOS release
        if: needs.validate.outputs.release == 'true'
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg --ci

      - name: Normalize and verify macOS release artifacts
        if: needs.validate.outputs.release == 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          bundle="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          app="$(find "$bundle/macos" -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          updater="$(find "$bundle/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          test -n "$app" && test -n "$dmg" && test -n "$updater" && test -f "$updater.sig"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$dmg"
          cargo run --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --example verify_updater_signature -- \
            apps/desktop/src-tauri/tauri.conf.json "$updater" "$updater.sig"
          mkdir -p output/releases
          cp "$dmg" "output/releases/Codex-Usage-${VERSION}-macos-arm64.dmg"
          cp "$updater" "output/releases/Codex-Usage-${VERSION}-darwin-aarch64.app.tar.gz"
          cp "$updater.sig" "output/releases/Codex-Usage-${VERSION}-darwin-aarch64.app.tar.gz.sig"

      - name: Upload signed macOS artifacts
        if: needs.validate.outputs.release == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: codex-usage-macos-arm64-signed
          path: output/releases/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing keychain
        if: always() && needs.validate.outputs.release == 'true'
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

  windows-native:
    name: Build Windows x64 native app
    needs: validate
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Build and smoke-test packaged agent
        shell: pwsh
        run: ./scripts/build-agent-windows-x64.ps1

      - name: Install native app dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test native frontend and Rust host
        working-directory: apps/desktop
        run: |
          npm test
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Windows application binary
        working-directory: apps/desktop
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --no-bundle --ci

      - name: Require Azure and updater signing secrets
        if: needs.validate.outputs.release == 'true'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $required = 'AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID','ARTIFACT_SIGNING_ENDPOINT','ARTIFACT_SIGNING_ACCOUNT','ARTIFACT_SIGNING_PROFILE','TAURI_SIGNING_PRIVATE_KEY','TAURI_SIGNING_PRIVATE_KEY_PASSWORD'
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) { throw "Missing required secret: $name" }
          }

      - name: Sign in to Azure with GitHub OIDC
        if: needs.validate.outputs.release == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows application and agent
        if: needs.validate.outputs.release == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\apps\desktop\src-tauri\target\x86_64-pc-windows-msvc\release\codex-usage-desktop.exe
            ${{ github.workspace }}\apps\desktop\src-tauri\binaries\codex-usage-agent-x86_64-pc-windows-msvc.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Bundle NSIS installer
        if: needs.validate.outputs.release == 'true'
        working-directory: apps/desktop
        run: npm run tauri bundle -- --target x86_64-pc-windows-msvc --bundles nsis --ci

      - name: Normalize NSIS installer
        if: needs.validate.outputs.release == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $installer = Get-ChildItem "apps\desktop\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Tauri did not produce an NSIS installer" }
          New-Item -ItemType Directory -Force -Path "output\releases" | Out-Null
          Copy-Item $installer.FullName "output\releases\Codex-Usage-$env:VERSION-windows-x64-setup.exe"

      - name: Sign NSIS installer
        if: needs.validate.outputs.release == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\output\releases\Codex-Usage-${{ needs.validate.outputs.version }}-windows-x64-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Build and sign Windows updater archive
        if: needs.validate.outputs.release == 'true'
        shell: pwsh
        working-directory: apps/desktop
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $installer = "..\..\output\releases\Codex-Usage-$env:VERSION-windows-x64-setup.exe"
          $archive = "..\..\output\releases\Codex-Usage-$env:VERSION-windows-x86_64.nsis.zip"
          & "..\..\scripts\repack-signed-windows-updater.ps1" -Installer $installer -Archive $archive | Out-Null
          npm exec tauri signer sign -- $archive
          if ($LASTEXITCODE -ne 0) { throw "Tauri updater signing failed" }

      - name: Verify Windows signatures
        if: needs.validate.outputs.release == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $files = @(
            "apps\desktop\src-tauri\target\x86_64-pc-windows-msvc\release\codex-usage-desktop.exe",
            "apps\desktop\src-tauri\binaries\codex-usage-agent-x86_64-pc-windows-msvc.exe",
            "output\releases\Codex-Usage-$env:VERSION-windows-x64-setup.exe"
          )
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature for $file`: $($signature.Status)" }
          }
          $updater = "output\releases\Codex-Usage-$env:VERSION-windows-x86_64.nsis.zip"
          if (-not (Test-Path "$updater.sig")) { throw "Missing Tauri updater signature" }
          cargo run --manifest-path apps/desktop/src-tauri/Cargo.toml --example verify_updater_signature -- apps/desktop/src-tauri/tauri.conf.json $updater "$updater.sig"
          if ($LASTEXITCODE -ne 0) { throw "Invalid Tauri updater signature" }

      - name: Upload signed Windows artifacts
        if: needs.validate.outputs.release == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: codex-usage-windows-x64-signed
          path: output/releases/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish signed native release and companion
    needs:
      - validate
      - companion
      - macos-native
      - windows-native
    if: needs.validate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install companion publishing dependencies
        working-directory: extensions/vscode
        run: npm ci

      - name: Download signed release artifacts
        uses: actions/download-artifact@v6
        with:
          path: output/releases
          merge-multiple: true

      - name: Build update metadata and checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python scripts/prepare-native-release.py \
            --directory output/releases \
            --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION"
          test -f output/releases/latest.json
          sha256sum --check output/releases/SHA256SUMS.txt

      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" output/releases/* --clobber
          else
            gh release create "$tag" output/releases/* \
              --verify-tag \
              --title "Codex Usage ${VERSION}" \
              --notes "Signed Codex Usage native apps and the optional VS Code companion. See CHANGELOG.md for release details."
          fi

      - name: Publish VS Code companion
        working-directory: extensions/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "$VSCE_PAT"
          npx vsce publish --skip-duplicate --packagePath ../../output/releases/codex-usage-companion.vsix

      - name: Verify published assets and Marketplace version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          expected_assets=9
          actual_assets="$(gh release view "v${VERSION}" --json assets --jq '.assets | length')"
          test "$actual_assets" -eq "$expected_assets"
          for attempt in $(seq 1 12); do
            marketplace_version="$(cd extensions/vscode && npx vsce show wenjun-mao.codex-usage-dashboard --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).versions[0].version))')"
            if [[ "$marketplace_version" == "$VERSION" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Marketplace did not report version $VERSION within the verification window." >&2
          exit 1
