name: WebKit Input Diagnostic
run-name: "WebKit input diagnostic control=${{ inputs.control }} preflight=${{ inputs.profiler_preflight }} sample=${{ inputs.process_sample }} lookup=${{ inputs.eval_lookup }}"
on:
  workflow_dispatch:
    inputs:
      control:
        description: Extra diagnostic-only non-DOM query before the real style read
        type: choice
        options: [none, scalar, object, clock, page-scalar]
        default: none
      process_sample:
        description: Held sampler; true fails before attachment until ownership contract is reviewed
        type: boolean
        default: false
      profiler_preflight:
        description: Read-only installed profiler capability discovery; no attachment
        type: boolean
        default: false
      eval_lookup:
        description: Diagnostic public eval lookup clock or unchanged data-descriptor control
        type: choice
        options: [none, descriptor, clock]
        default: none
permissions:
  contents: read
jobs:
  diagnostic:
    name: Input protocol diagnostic
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require nonpublishing main context
        env:
          EVAL_LOOKUP: ${{ inputs.eval_lookup }}
          CONTROL: ${{ inputs.control }}
          PROCESS_SAMPLE: ${{ inputs.process_sample }}
          PROFILER_PREFLIGHT: ${{ inputs.profiler_preflight }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          if [ "$EVAL_LOOKUP" != none ]; then
            test "$CONTROL" = none
            test "$PROCESS_SAMPLE" = false
            test "$PROFILER_PREFLIGHT" = false
          fi
      - uses: ./.github/actions/qualification-tools
      - name: Install original styling engines
        run: uv run playwright install chromium firefox webkit
      - name: Inspect profiler capabilities outside every input timer
        if: inputs.profiler_preflight == true
        run: uv run python scripts/probes/profiler_capabilities.py --output output/diagnostic/hover/profiler-capabilities
      - name: Trace one bounded original input sequence without changing its guard
        env:
          DEBUG: pw:protocol,pw:api,pw:browser
          CONTROL: ${{ inputs.control }}
          PROCESS_SAMPLE: ${{ inputs.process_sample }}
          EVAL_LOOKUP: ${{ inputs.eval_lookup }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/diagnostic/hover
          sample=""
          if [[ "$PROCESS_SAMPLE" == true ]]; then sample="--process-sample"; fi
          uv run python scripts/probes/hover_input_latency.py --renderer-clock --control "$CONTROL" $sample --output output/diagnostic/hover --eval-lookup "$EVAL_LOOKUP" \
            2>&1 | tee output/diagnostic/hover/protocol.log
      - name: Preserve diagnostic output, never producer receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hover-input-diagnostic-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: output/diagnostic/hover
          if-no-files-found: warn
          retention-days: 14
