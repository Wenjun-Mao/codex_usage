[project]
name = "codex-usage"
version = "1.5.0"
description = "Local Codex session token usage analyzer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "filelock>=3.29.7",
    "pydantic-settings>=2.12.0",
    "tenacity>=9.1.2",
    "tzdata>=2025.2; platform_system == 'Windows'",
    "zstandard>=0.25.0,<0.26",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[project.scripts]
codex-usage = "codex_usage.cli:main"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "playwright>=1.62.0",
    "pytest>=9.0.2",
]
package = [
    "pyinstaller>=6.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
