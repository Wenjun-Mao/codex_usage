[project]
name = "codex-usage"
version = "2.1.0"
description = "Private capture and ledger core for the Codex Usage native app"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "filelock>=3.29.7",
    "pydantic-settings>=2.12.0",
    "tenacity>=9.1.2",
    "tzdata>=2025.2; platform_system == 'Windows'",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "playwright>=1.62.0",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]
package = [
    "pyinstaller>=6.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
