[package]
name = "codex-usage-desktop"
version = "2.1.0"
description = "Native local Codex usage ledger and task tools"
authors = ["Wenjun Mao"]
license = "MIT"
repository = "https://github.com/Wenjun-Mao/codex_usage"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "codex_usage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
dirs = "6.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.6"
tauri-plugin-updater = "2.11.0"
tokio = { version = "1.49", features = ["time", "sync"] }

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2.5"
